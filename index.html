function getProduct(id){return products.find(p=>p.id===id)}

function addCart(id,qty=1,options={}){const p=getProduct(id);if(!p)return;const key=id+"|"+(options.size||"")+"|"+(options.color||"");let item=state.cart.find(x=>x.key===key);if(item)item.qty=Math.min(p.stock,item.qty+qty);else state.cart.push({key,id,qty:Math.min(p.stock,qty),size:options.size||p.sizes[1],color:options.color||p.colors[0]});save();updateBadges();toast(`${p.name} added to cart`)}
function removeCart(key){state.cart=state.cart.filter(x=>x.key!==key);save();render();updateBadges()}
function setQty(key,delta){const x=state.cart.find(x=>x.key===key);if(!x)return;x.qty=Math.max(1,Math.min(getProduct(x.id).stock,x.qty+delta));save();render();updateBadges()}
function cartItems(){return state.cart.map(x=>({...x,p:getProduct(x.id)})).filter(x=>x.p)}
function totals(){let sub=cartItems().reduce((a,x)=>a+x.p.price*x.qty,0);let mrp=cartItems().reduce((a,x)=>a+x.p.mrp*x.qty,0);let discount=mrp-sub;let coupon=state.coupon==="DRAGON10"?Math.round(sub*.10):state.coupon==="DIWALI20"?Math.round(sub*.20):state.coupon==="SPORTS15"?Math.round(sub*.15):0;let delivery=sub>=2999?0:149;return {sub,mrp,discount,coupon,delivery,total:Math.max(0,sub-coupon+delivery)}}

function gym(){const a=products.filter(p=>["Dumbbells","Barbell","Weight Plate","Kettlebell","Resistance Bands","Yoga Mat","Gym Bench","Pull Up Bar","Treadmill","Skipping Rope"].includes(p.category));return `<div class="container page"><h1>Gym Equipment</h1><p class="muted">Build your training setup.</p>${productGrid(a)}</div>`}
function offers(){const deals=[...products].sort((a,b)=>b.discount-a.discount);return `<div class="container page"><h1>Offers</h1><div class="chips"><button class="chip" onclick="go('offers')">DIWALI SPECIAL</button><button class="chip" onclick="state.sort='Biggest Discount';go('shop')">FLASH SALE</button><button class="chip" onclick="state.query='';state.filters.discount=20;go('shop')">COMBO OFFERS</button><button class="chip" onclick="go('offers')">LIMITED OFFERS</button><button class="chip" onclick="openCoupon()">COUPONS</button><button class="chip" onclick="state.filters.discount=30;go('shop')">CLEARANCE SALE</button></div><section class="section"><div class="detail-box"><h2>Coupons</h2><p>Use <b>DRAGON10</b> for 10%, <b>DIWALI20</b> for 20%, or <b>SPORTS15</b> for 15% off eligible demo cart items.</p><button class="btn primary" onclick="openCoupon()">Apply coupon</button></div></section>${section("Best Deals",deals,"state.sort='Biggest Discount';go('shop')")}</div>`}
function openCoupon(){openModal(`<div class="modal-head"><h2>Apply Coupon</h2><button class="close" onclick="closeModal()">×</button></div><input id="couponInput" class="select" style="width:100%" value="${state.coupon}" placeholder="DRAGON10"><button class="btn primary" style="margin-top:10px" onclick="applyCoupon()">Apply</button>`)}
function applyCoupon(){const c=document.getElementById("couponInput").value.trim().toUpperCase();if(["DRAGON10","DIWALI20","SPORTS15"].includes(c)){state.coupon=c;save();closeModal();toast(c+" applied");go("cart")}else toast("Invalid demo coupon")}
function productPage(id){const p=getProduct(id);if(!p)return `<div class="container page"><h1>Product not found</h1><button class="btn primary" onclick="go('shop')">Back to shop</button></div>`;addRecent(id);const reviews=demoReviews(p);return `<div class="container page"><div class="detail"><div class="gallery"><div class="thumbs">${p.images.map((im,i)=>`<img class="${i===0?"active":""}" src="${im}" onerror="imgFallback(event,'${p.name}')" onclick="setMainImg('${im}',this)">`).join("")}</div><div class="mainpic"><img id="mainProductImg" src="${p.images[0]}" alt="${p.name}" onerror="imgFallback(event,'${p.name}')"></div></div><div><div class="brandline">${p.brand} • ${p.category} • ${p.id}</div><h1>${p.name}</h1><div class="rating">★ ${p.rating} <span class="muted">${p.reviews} reviews</span></div><div class="bigprice">${money(p.price)} <span class="mrp">${money(p.mrp)}</span> <span class="discount">${p.discount}% OFF</span></div><div class="detail-box"><b>Colour</b><div class="option-row" style="margin-top:8px">${p.colors.map((x,i)=>`<button class="option ${i===0?"active":""}" onclick="selectOpt(this)">${x}</button>`).join("")}</div></div><div class="detail-box"><b>Size</b><div class="option-row" style="margin-top:8px">${p.sizes.map((x,i)=>`<button class="option ${i===1?"active":""}" onclick="selectOpt(this)">${x}</button>`).join("")}</div></div><div class="detail-box"><b>Quantity</b><div class="qty" style="margin-top:8px"><button onclick="detailQty(-1)">−</button><b id="detailQty">1</b><button onclick="detailQty(1)">+</button><span class="muted">${p.stock} available</span></div></div><div class="actions"><button class="btn primary" onclick="detailAdd('${p.id}')">ADD TO CART</button><button class="btn yellow" onclick="buyNow('${p.id}')">BUY NOW</button><button class="btn" onclick="toggleWish('${p.id}')">${isWish(p.id)?"♥ SAVED":"♡ WISHLIST"}</button><button class="btn" onclick="shareProduct('${p.id}')">SHARE</button></div><div class="detail-box"><b>Description</b><p class="muted">${p.description}</p><b>Specifications</b><ul>${p.specifications.map(x=>`<li>${x}</li>`).join("")}</ul><b>Delivery</b><p class="muted">${p.shipping}</p><b>Returns</b><p class="muted">${p.returns}</p>${p.nutrition?`<b>Nutrition</b><p class="muted">${p.nutrition}</p>`:""}</div></div></div><section class="section"><div class="section-head"><h2>Customer Reviews</h2><button onclick="writeReview('${p.id}')">Write Review</button></div><div class="detail-box">${reviews.join("")}</div></section></div>`}
function setMainImg(im,el){document.getElementById("mainProductImg").src=im;document.querySelectorAll(".thumbs img").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
let dq=1;function detailQty(d){dq=Math.max(1,dq+d);const e=document.getElementById("detailQty");if(e)e.textContent=dq}function selectOpt(el){el.parentElement.querySelectorAll(".option").forEach(x=>x.classList.remove("active"));el.classList.add("active")}
function detailAdd(id){const color=document.querySelector(".detail .option-row .active")?.textContent||"Black";const size=document.querySelectorAll(".detail .option-row")[1]?.querySelector(".active")?.textContent||"M";addCart(id,dq,{color,size});dq=1}
function buyNow(id){state.checkout.buyNow={id,qty:dq};state.checkout.step=1;go("checkout")}
async function shareProduct(id){const p=getProduct(id);if(navigator.share)try{await navigator.share({title:p.name,text:`${p.name} at Dragon Sports`,url:location.href})}catch(e){}else{await navigator.clipboard?.writeText(location.href);toast("Product link copied")}}
function demoReviews(p){return [`<div class="review"><b>★★★★★</b> <span class="muted">Verified buyer</span><p>Good quality and fast delivery. The product feels durable.</p></div>`,`<div class="review"><b>★★★★☆</b> <span class="muted">Verified buyer</span><p>Value for money and packaging was secure.</p></div>`]}
function writeReview(id){openModal(`<div class="modal-head"><h2>Write Review</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><select id="reviewRating"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select><textarea id="reviewText" rows="4" placeholder="Share your experience"></textarea><input type="file" accept="image/*"><button class="btn primary" onclick="submitReview('${id}')">Submit Review</button></div>`)}
function submitReview(id){const r=+document.getElementById("reviewRating").value,text=document.getElementById("reviewText").value.trim();if(!text)return toast("Write a review first");const key="ds_reviews_"+id, arr=JSON.parse(localStorage.getItem(key)||"[]");arr.unshift({r,text,date:new Date().toLocaleDateString()});localStorage.setItem(key,JSON.stringify(arr));closeModal();toast("Review submitted");go("product",id)}
function cart(){const items=cartItems(),t=totals();return `<div class="container page"><h1>Your Cart</h1>${items.length?`<div class="detail" style="grid-template-columns:1fr 330px"><div>${items.map(x=>`<div class="cart-row"><img src="${x.p.img}" onerror="imgFallback(event,'${x.p.name}')"><div><div class="brandline">${x.p.brand}</div><h3>${x.p.name}</h3><div class="muted">Size: ${x.size} • Colour: ${x.color}</div><div class="price">${money(x.p.price)}</div><div class="cart-actions"><button class="btn small" onclick="setQty('${x.key}',-1)">−</button><b>${x.qty}</b><button class="btn small" onclick="setQty('${x.key}',1)">+</button><button class="btn small" onclick="saveLater('${x.key}')">Save for later</button><button class="btn small" onclick="removeCart('${x.key}')">Remove</button></div></div><div><b>${money(x.p.price*x.qty)}</b></div></div>`).join("")}<button class="btn" onclick="state.cart=[];save();render();updateBadges()">Clear cart</button></div><div class="summary"><h3>Order Summary</h3><div class="sumline"><span>MRP</span><span>${money(t.mrp)}</span></div><div class="sumline"><span>Product discount</span><span>−${money(t.discount)}</span></div><div class="sumline"><span>Coupon</span><span>−${money(t.coupon)}</span></div><div class="sumline"><span>Delivery</span><span>${t.delivery?money(t.delivery):"FREE"}</span></div><div class="total sumline"><span>Total</span><span>${money(t.total)}</span></div><button class="btn small" onclick="openCoupon()">Apply coupon</button><button class="btn primary" style="width:100%;margin-top:10px" onclick="go('checkout')">CHECKOUT</button></div></div>`:`<div class="detail-box"><h2>Your cart is empty</h2><p class="muted">Add products from the shop to start an order.</p><button class="btn primary" onclick="go('shop')">SHOP NOW</button></div>`}</div>`}
function saveLater(key){const x=state.cart.find(x=>x.key===key);if(x){state.wish.push(x.id);removeCart(key);toast("Saved to wishlist")}}
function wishlist(){const a=state.wish.map(getProduct).filter(Boolean);return `<div class="container page"><div class="section-head"><div><h1>Wishlist</h1><p class="muted">${a.length} saved products</p></div></div>${a.length?`<div class="grid">${a.map(p=>card(p)).join("")}</div>`:`<div class="detail-box"><h2>Your wishlist is empty</h2><button class="btn primary" onclick="go('shop')">EXPLORE PRODUCTS</button></div>`}</div>`}
function checkout(){let items=state.checkout.buyNow?[{p:getProduct(state.checkout.buyNow.id),qty:state.checkout.buyNow.qty,size:"M",color:"Black"}]:cartItems();if(!items.length)return `<div class="container page"><h1>Checkout</h1><p>Your cart is empty.</p><button class="btn primary" onclick="go('shop')">Shop now</button></div>`;let t=state.checkout.buyNow?(()=>{const x=items[0];const sub=x.p.price*x.qty;const mrp=x.p.mrp*x.qty;return{sub,mrp,discount:mrp-sub,coupon:0,delivery:sub>=2999?0:149,total:sub+(sub>=2999?0:149)}})():totals();const s=state.checkout.step;return `<div class="container page"><h1>Checkout</h1><div class="checkout-steps">${["Customer","Address","Delivery","Payment","Confirm"].map((x,i)=>`<span class="step ${s===i+1?"active":""}">${i+1}. ${x}</span>`).join("")}</div><div class="detail" style="grid-template-columns:1fr 330px"><div class="detail-box">${s===1?checkoutCustomer():s===2?checkoutAddress():s===3?checkoutDelivery():s===4?checkoutPayment():checkoutConfirm(items,t)}</div><div class="summary"><h3>Summary</h3>${items.map(x=>`<div class="sumline"><span>${x.p.name} ×${x.qty}</span><span>${money(x.p.price*x.qty)}</span></div>`).join("")}<div class="sumline"><span>Delivery</span><span>${t.delivery?money(t.delivery):"FREE"}</span></div><div class="total sumline"><span>Total</span><span>${money(t.total)}</span></div></div></div></div>`}
function checkoutCustomer(){const c=state.checkout.customer;return `<h2>Customer Information</h2><div class="form"><input id="cname" placeholder="Full name" value="${c.name||""}"><input id="cmobile" placeholder="Mobile number" value="${c.mobile||""}"><input id="cemail" type="email" placeholder="Email" value="${c.email||""}"><button class="btn primary" onclick="nextCheckout(1)">Continue</button></div>`}
function checkoutAddress(){const a=state.checkout.address;return `<h2>Delivery Address</h2><div class="form"><input id="street" placeholder="House / Street" value="${a.street||""}"><input id="town" placeholder="Village / Town" value="${a.town||"Kodumudi"}"><div class="two"><input id="district" placeholder="District" value="${a.district||"Erode"}"><input id="state" placeholder="State" value="${a.state||"Tamil Nadu"}"></div><input id="pincode" placeholder="Pincode" value="${a.pincode||""}"><p class="muted">Business location reference: Kodumudi, Erode, Tamil Nadu, India.</p><button class="btn primary" onclick="nextCheckout(2)">Continue</button></div>`}
function checkoutDelivery(){return `<h2>Delivery Method</h2><div class="option-row"><button class="option ${state.checkout.delivery==="Standard Delivery"?"active":""}" onclick="state.checkout.delivery='Standard Delivery';render()">Standard Delivery</button><button class="option ${state.checkout.delivery==="Express Delivery"?"active":""}" onclick="state.checkout.delivery='Express Delivery';render()">Express Delivery</button></div><p class="muted">Standard: 3–7 business days. Express: 1–3 business days.</p><button class="btn primary" onclick="nextCheckout(3)">Continue</button>`}
function checkoutPayment(){const p=state.checkout.payment;return `<h2>Payment</h2><div class="option-row">${["Cash on Delivery","UPI","Google Pay","PhonePe","Paytm","Credit Card","Debit Card","Net Banking"].map(x=>`<button class="option ${p===x?"active":""}" onclick="state.checkout.payment='${x}';render()">${x}</button>`).join("")}</div><div class="detail-box"><b>Demo payment notice</b><p class="muted">COD can be selected in this demo. Online payment buttons are UI integration points only until a real gateway and server verification endpoint are configured.</p></div><button class="btn primary" onclick="nextCheckout(4)">Continue</button>`}
function checkoutConfirm(items,t){return `<h2>Confirm Order</h2><p><b>${state.checkout.customer.name}</b> • ${state.checkout.customer.mobile}</p><p class="muted">${Object.values(state.checkout.address).filter(Boolean).join(", ")}</p><p>Delivery: <b>${state.checkout.delivery}</b> • Payment: <b>${state.checkout.payment}</b></p><div class="detail-box">${items.map(x=>`<div class="sumline"><span>${x.p.name} ×${x.qty}</span><span>${money(x.p.price*x.qty)}</span></div>`).join("")}<div class="total sumline"><span>Total</span><span>${money(t.total)}</span></div></div><button class="btn primary" onclick="placeOrder()">PLACE DEMO ORDER</button>`}
function nextCheckout(step){if(step===1){const name=document.getElementById("cname").value.trim(),mobile=document.getElementById("cmobile").value.trim(),email=document.getElementById("cemail").value.trim();if(!name||!mobile||!email)return toast("Complete customer information");state.checkout.customer={name,mobile,email}}
if(step===2){const ids=["street","town","district","state","pincode"],a={};ids.forEach(i=>a[i]=document.getElementById(i).value.trim());if(!a.street||!a.town||!a.district||!a.state||!a.pincode)return toast("Complete delivery address");state.checkout.address=a}
state.checkout.step=step+1;render()}
function placeOrder(){const buy=state.checkout.buyNow;const items=buy?[{p:getProduct(buy.id),qty:buy.qty}]:cartItems().map(x=>({p:x.p,qty:x.qty}));if(!items.length)return;const t=buy?(()=>{let sub=items.reduce((a,x)=>a+x.p.price*x.qty,0);return{sub,total:sub+(sub>=2999?0:149),delivery:sub>=2999?0:149}})():totals();const order={id:"DS"+Date.now().toString().slice(-8),date:new Date().toISOString(),items:items.map(x=>({id:x.p.id,name:x.p.name,qty:x.qty,price:x.p.price,img:x.p.img})),total:t.total,address:state.checkout.address,customer:state.checkout.customer,payment:state.checkout.payment,delivery:state.checkout.delivery,status:"Order Confirmed",timeline:["Order Confirmed"],returnStatus:null};state.orders.unshift(order);if(!buy)state.cart=[];state.checkout.buyNow=null;state.checkout.step=1;save();updateBadges();go("order",order.id);toast("Order placed successfully")}
function orders(){return `<div class="container page"><h1>My Orders</h1>${state.orders.length?state.orders.map(o=>orderCard(o)).join(""):`<div class="detail-box"><p class="muted">No orders yet.</p><button class="btn primary" onclick="go('shop')">SHOP NOW</button></div>`}</div>`}
function orderCard(o){return `<div class="order"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${o.id}</b><div class="muted">${new Date(o.date).toLocaleString()}</div></div><b>${money(o.total)}</b></div><p>${o.items.map(x=>`${x.name} ×${x.qty}`).join(" • ")}</p><div class="statusbar">${["Order Confirmed","Processing","Packed","Shipped","Out for Delivery"].map((s,i)=>`<div class="${statusIndex(o.status)>=i?"done":""}">${s}</div>`).join("")}</div><div class="actions"><button class="btn small" onclick="go('order','${o.id}')">View / Track</button><button class="btn small" onclick="cancelOrder('${o.id}')">Cancel</button><button class="btn small" onclick="returnOrder('${o.id}')">Return</button></div></div>`}
function statusIndex(s){return ["Order Confirmed","Processing","Packed","Shipped","Out for Delivery","Delivered"].indexOf(s)}
function orderPage(id){const o=state.orders.find(x=>x.id===id);if(!o)return orders();return `<div class="container page"><button class="btn small" onclick="go('orders')">← My Orders</button><div class="order" style="margin-top:12px"><h1>${o.id}</h1><p class="muted">${new Date(o.date).toLocaleString()}</p><div class="statusbar">${["Order Confirmed","Processing","Packed","Shipped","Out for Delivery"].map((s,i)=>`<div class="${statusIndex(o.status)>=i?"done":""}">${s}</div>`).join("")}</div>${o.items.map(x=>`<div class="cart-row"><img src="${x.img}" onerror="imgFallback(event,'${x.name}')"><div><b>${x.name}</b><p>Quantity: ${x.qty}</p></div><b>${money(x.price*x.qty)}</b></div>`).join("")}<div class="detail-box"><b>Delivery</b><p class="muted">${Object.values(o.address).join(", ")}</p><b>Payment</b><p>${o.payment}</p><b>Estimated delivery</b><p>${o.delivery==="Express Delivery"?"1–3":"3–7"} business days</p></div><div class="actions"><button class="btn" onclick="cancelOrder('${o.id}')">Cancel Order</button><button class="btn" onclick="returnOrder('${o.id}')">Return Product</button></div></div></div>`}
function cancelOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;if(["Shipped","Out for Delivery","Delivered"].includes(o.status))return toast("This order cannot be cancelled at this stage");o.status="Cancelled";o.timeline.push("Cancelled");save();render();toast("Order cancelled")}
function returnOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;openModal(`<div class="modal-head"><h2>Return / Replacement</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><select id="retProduct">${o.items.map(x=>`<option>${x.name}</option>`).join("")}</select><select id="retReason"><option>Damaged product</option><option>Wrong product</option><option>Size issue</option><option>Changed my mind</option></select><select id="retType"><option>Return</option><option>Replacement</option><option>Exchange</option></select><input id="retPhoto" type="file" accept="image/*"><button class="btn primary" onclick="submitReturn('${id}')">Submit Request</button></div>`)}
function submitReturn(id){const o=state.orders.find(x=>x.id===id);o.returnStatus={product:document.getElementById("retProduct").value,reason:document.getElementById("retReason").value,type:document.getElementById("retType").value,status:"Request Submitted"};save();closeModal();render();toast("Return request submitted")}
function account(){return `<div class="container page"><h1>Account</h1><div class="account-grid"><aside class="side-menu">${["Profile","Orders","Wishlist","Addresses","Payment Methods","Reviews","Returns","Coupons","Notifications","Settings"].map((x,i)=>`<button onclick="accountAction('${x}')">${x}</button>`).join("")}<button onclick="logout()">Logout</button></aside><section><div class="detail-box"><h2>Welcome to Dragon Sports</h2><p class="muted">Manage your profile, orders, wishlist, addresses, reviews and preferences.</p><div class="admin-stat"><div class="stat">Orders<b>${state.orders.length}</b></div><div class="stat">Wishlist<b>${state.wish.length}</b></div><div class="stat">Recent views<b>${state.recent.length}</b></div><div class="stat">Coupons<b>3</b></div></div></div><div class="detail-box"><h3>Quick actions</h3><div class="actions"><button class="btn" onclick="go('orders')">My Orders</button><button class="btn" onclick="go('wishlist')">Wishlist</button><button class="btn" onclick="go('care')">Customer Care</button><button class="btn" onclick="go('admin')">Admin Demo</button></div></div></section></div></div>`}
function accountAction(x){if(x==="Orders")go("orders");else if(x==="Wishlist")go("wishlist");else if(x==="Coupons")go("offers");else if(x==="Reviews")toast("Your submitted reviews are stored locally in this demo");else if(x==="Returns")go("orders");else toast(x+" section is ready for API-backed account integration")}
function logout(){toast("Demo logout complete")}
function forYou(){const recent=state.recent.map(getProduct).filter(Boolean),w=state.wish.map(getProduct).filter(Boolean),fallback=[...products].sort((a,b)=>b.rating-a.rating);return `<div class="container page"><h1>For You</h1><p class="muted">Recommendations use recent views, wishlist, cart and popular products stored on this device.</p>${recent.length?section("Recently Viewed",recent,"go('shop')"):""}${w.length?section("From Your Wishlist",w,"go('wishlist')"):""}${section(recent.length||w.length?"Popular for You":"Trending Products",fallback,"go('shop')")}</div>`}
function care(){return `<div class="container page"><h1>Customer Care</h1><div class="detail-box"><h2>We’re here to help</h2><p class="muted">Phone: 93451 11332 • 99556 64466</p><div class="actions"><a class="btn primary" href="tel:+919345111332">CALL NOW</a><a class="btn green" target="_blank" href="https://wa.me/919345111332?text=Hello%20Dragon%20Sports">WHATSAPP</a><button class="btn" onclick="openChat()">LIVE CHAT</button><button class="btn" onclick="go('faq')">FAQ</button></div></div><div class="section"><h2>FAQ</h2><div class="category-grid">${["Orders","Payment","Delivery","Returns","Products","Account"].map(x=>`<button class="category" onclick="faq('${x}')"><b>${x}</b><small>View answers →</small></button>`).join("")}</div></div></div>`}
function openChat(){openModal(`<div class="modal-head"><h2>Live Chat</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Demo chat is available locally. Connect your preferred chat provider at /api/chat.</p><div id="chatBox" class="detail-box">Dragon Sports: Hi! How can we help?</div><div class="searchbox"><input id="chatInput" placeholder="Type a message"><button onclick="sendChat()">Send</button></div>`)}
function sendChat(){const x=document.getElementById("chatInput").value.trim();if(!x)return;document.getElementById("chatBox").innerHTML+=`<p><b>You:</b> ${x}</p><p><b>Dragon Sports:</b> Thanks! Our support team will assist with your query.</p>`;document.getElementById("chatInput").value=""}
function faq(c){openModal(`<div class="modal-head"><h2>${c} FAQ</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Demo FAQ content: please connect this section to your CMS/help-center API for live policies.</p><ul><li>How do I track an order?</li><li>How do I request a return?</li><li>Which payment methods are supported?</li><li>How can I contact customer care?</li></ul>`)}
function about(){return `<div class="container page"><div class="hero" style="min-height:310px"><div class="hero-content"><div class="eyebrow">ABOUT DRAGON SPORTS</div><h1>UNLEASH YOUR GAME</h1><p>Dragon Sports is a sports shopping concept based in Kodumudi, Erode, Tamil Nadu, India.</p></div></div><div class="section"><div class="grid">${["Our Mission","Our Story","Why Choose Us","Quality Products","Customer Support","Fast Delivery"].map(x=>`<div class="detail-box"><h3>${x}</h3><p class="muted">Performance-focused sports retail with a clean, customer-first shopping experience.</p></div>`).join("")}</div></div><div class="detail-box"><b>Address</b><p>Kodumudi, Erode, Tamil Nadu, India</p><p>93451 11332 • 99556 64466</p></div></div>`}
function footer(){return `<footer class="container" style="border-top:1px solid #292929;padding:30px 0 110px;margin-top:35px"><div class="grid"><div><h3>Dragon Sports</h3><p class="muted">UNLEASH YOUR GAME</p></div><div><b>Shop</b><p><button class="navlink" onclick="go('sports')">Sports</button></p><p><button class="navlink" onclick="go('offers')">Offers</button></p></div><div><b>Help</b><p><button class="navlink" onclick="go('care')">Customer Care</button></p><p><button class="navlink" onclick="go('orders')">Shipping & Returns</button></p></div><div><b>Company</b><p><button class="navlink" onclick="go('about')">About</button></p><p><button class="navlink" onclick="go('terms')">Privacy / Terms</button></p></div></div><div class="muted" style="margin-top:22px">© 2026 Dragon Sports • Demo storefront</div></footer>`}
function admin(){const rev=state.orders.reduce((a,o)=>a+o.total,0);return `<div class="container page"><div class="section-head"><div><h1>Admin Dashboard</h1><p class="muted">Local demo management console. Replace repositories with authenticated APIs for production.</p></div><button class="btn primary" onclick="adminAdd()">Add Product</button></div><div class="admin-stat"><div class="stat">Total Products<b>${products.length}</b></div><div class="stat">Total Orders<b>${state.orders.length}</b></div><div class="stat">Total Customers<b>${state.orders.length?1:0}</b></div><div class="stat">Revenue<b>${money(rev)}</b></div><div class="stat">Pending Orders<b>${state.orders.filter(o=>o.status!=="Delivered"&&o.status!=="Cancelled").length}</b></div><div class="stat">Low Stock<b>${products.filter(p=>p.stock<8).length}</b></div><div class="stat">Returns<b>${state.orders.filter(o=>o.returnStatus).length}</b></div><div class="stat">Coupons<b>3</b></div></div><section class="section"><h2>Orders</h2><div class="tablewrap"><table class="table"><tr><th>Order</th><th>Total</th><th>Status</th><th>Update</th><th>Return</th></tr>${state.orders.map(o=>`<tr><td>${o.id}</td><td>${money(o.total)}</td><td>${o.status}</td><td><select onchange="adminStatus('${o.id}',this.value)">${["Order Confirmed","Processing","Packed","Shipped","Out for Delivery","Delivered","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td><td>${o.returnStatus?o.returnStatus.status:"—"}</td></tr>`).join("")}</table></div></section><section class="section"><h2>Product Management</h2><div class="tablewrap"><table class="table"><tr><th>ID</th><th>Product</th><th>Price</th><th>Stock</th><th>Action</th></tr>${products.slice(0,20).map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button class="btn small" onclick="adminEdit('${p.id}')">Edit</button></td></tr>`).join("")}</table></div></section></div>`}
function adminStatus(id,s){const o=state.orders.find(x=>x.id===id);if(o){o.status=s;o.timeline.push(s);save();toast("Order status updated")}}
function adminEdit(id){const p=getProduct(id);openModal(`<div class="modal-head"><h2>Edit Product</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><input id="epname" value="${p.name}"><input id="epprice" type="number" value="${p.price}"><input id="epmrp" type="number" value="${p.mrp}"><input id="epstock" type="number" value="${p.stock}"><input id="epimg" value="${p.img}"><button class="btn primary" onclick="saveProduct('${id}')">Save</button></div>`)}
function saveProduct(id){const p=getProduct(id);p.name=document.getElementById("epname").value;p.price=+document.getElementById("epprice").value;p.mrp=+document.getElementById("epmrp").value;p.stock=+document.getElementById("epstock").value;p.img=document.getElementById("epimg").value;p.discount=Math.round((1-p.price/p.mrp)*100);closeModal();render();toast("Product updated locally")}
function adminAdd(){openModal(`<div class="modal-head"><h2>Add Product</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">This demo form explains the integration structure; product persistence should use a server/API in production.</p><div class="form"><input placeholder="Product name"><input placeholder="Brand"><input type="number" placeholder="Price"><input type="number" placeholder="MRP"><input placeholder="Image URL"><button class="btn primary" onclick="closeModal();toast('Connect POST /api/products to enable persistent admin creation')">Create</button></div>`)}
function terms(){return `<div class="container page"><h1>Policies</h1><div class="detail-box"><h3>Privacy Policy</h3><p class="muted">This frontend demo stores cart, wishlist and demo orders in browser localStorage. A production deployment should replace this with secure server-side storage and appropriate privacy controls.</p><h3>Terms</h3><p class="muted">Product prices, inventory, delivery estimates and payments shown here are demo data unless connected to live commerce services.</p></div></div>`}
function modal(x){document.getElementById("modal").innerHTML=`<div class="modal-card">${x}</div>`;document.getElementById("modal").classList.remove("hidden")}
function openModal(x){modal(x)}function closeModal(){stopScanner();document.getElementById("modal").classList.add("hidden");document.getElementById("modal").innerHTML=""}

function t(k){return (translations[state.lang]||translations.English)[k]||translations.English[k]||k}
function setLang(l){state.lang=l;localStorage.setItem("ds_lang",l);const map={English:"en",Tamil:"ta",Hindi:"hi",Malayalam:"ml",Telugu:"te",Kannada:"kn",Bengali:"bn",Marathi:"mr",Arabic:"ar",French:"fr",Spanish:"es",German:"de",Japanese:"ja",Chinese:"zh"};document.documentElement.lang=map[l]||"en";render();toast("Language changed to "+l)}
function toggleMobileMenu(force){const el=document.getElementById("mobileMenu");if(!el)return;const open=typeof force==="boolean"?force:el.classList.contains("hidden");el.classList.toggle("hidden",!open);el.setAttribute("aria-hidden",String(!open));const b=document.querySelector(".mobile-menu-btn");if(b)b.setAttribute("aria-expanded",String(open))}
function mobileGo(page,param){toggleMobileMenu(false);go(page,param)}
function render(){updateBadges();let content=state.page==="home"?home():state.page==="shop"?shop():state.page==="sports"?sports():state.page==="dresses"?dresses():state.page==="nutrition"?nutrition():state.page==="gym"?gym():state.page==="offers"?offers():state.page==="product"?productPage(state.param):state.page==="cart"?cart():state.page==="wishlist"?wishlist():state.page==="checkout"?checkout():state.page==="orders"?orders():state.page==="order"?orderPage(state.param):state.page==="account"?account():state.page==="foryou"?forYou():state.page==="care"?care():state.page==="about"?about():state.page==="admin"?admin():terms();document.getElementById("app").innerHTML=content+footer();document.getElementById("lang").value=state.lang}
document.documentElement.lang=({English:"en",Tamil:"ta",Hindi:"hi",Malayalam:"ml",Telugu:"te",Kannada:"kn",Bengali:"bn",Marathi:"mr",Arabic:"ar",French:"fr",Spanish:"es",German:"de",Japanese:"ja",Chinese:"zh"}[state.lang]||"en");
render();
